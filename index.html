<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Osztály Üléssorrend Képekkel</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #333;
            margin-bottom: 5px;
            font-size: 20px;
            text-align: center;
        }
        p {
            color: #666;
            margin-bottom: 15px;
            font-size: 12px;
            text-align: center;
        }
        #grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
            max-width: 1200px;
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            box-sizing: border-box;
            width: 100%;
        }
        .seat {
            background: #ffffff;
            border: 2px dashed #3498db;
            border-radius: 8px;
            padding: 6px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            min-height: 80px;
        }
        .seat img {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 4px;
            border: 1px solid #ccc;
        }
        .seat span {
            font-size: 10px;
            font-weight: bold;
            color: #2c3e50;
            word-break: break-word;
        }
        .seat.drag-over {
            background: #ebf5fb;
            border-color: #2980b9;
        }
        @media (max-width: 1000px) {
            #grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }
        @media (max-width: 600px) {
            #grid {
                grid-template-columns: repeat(3, 1fr) !important;
                gap: 5px;
                padding: 8px;
            }
            .seat {
                min-height: 70px;
                padding: 3px;
            }
            .seat img {
                width: 30px;
                height: 30px;
            }
            .seat span {
                font-size: 8.5px;
            }
        }
    </style>
</head>
<body>

    <h1>Iskolai Üléssorrend Képekkel</h1>
    <p>Húzd át egerrel vagy kattints két személyre a helycseréhez (online szinkronnal)!</p>

    <div id="grid"></div>

    <script>
        // IDE ILLESD BE A SAJÁT NPOINT.IO URL CÍMEDET:
        const API_URL = 'https://www.npoint.io/docs/42ecce76285021549cf5';

        let students = [];
        let draggedIndex = null;
        let selectedIndex = null;

        async function loadData() {
            try {
                const response = await fetch(API_URL);
                if (response.ok) {
                    students = await response.json();
                    renderGrid();
                }
            } catch (error) {
                console.error("Hiba az adatok betöltésekor:", error);
            }
        }

        async function saveData() {
            try {
                await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(students)
                });
            } catch (error) {
                console.error("Hiba az adatok mentésekor:", error);
            }
        }

        function renderGrid() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';

            students.forEach((name, index) => {
                const seat = document.createElement('div');
                seat.className = 'seat';
                seat.draggable = true;
                seat.dataset.index = index;

                if (selectedIndex === index) {
                    seat.style.border = '2px solid red';
                    seat.style.backgroundColor = '#fadbd8';
                }

                const imgName = name ? name.trim() : '';
                const imgPath = imgName ? `${imgName}.jpg` : '';

                const img = document.createElement('img');
                img.src = imgPath;
                img.onerror = function () {
                    this.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="%232390caf9"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>';
                };

                const span = document.createElement('span');
                span.innerText = name || `Üres ${index + 1}`;

                seat.appendChild(img);
                seat.appendChild(span);

                seat.addEventListener('dragstart', handleDragStart);
                seat.addEventListener('dragover', handleDragOver);
                seat.addEventListener('dragleave', handleDragLeave);
                seat.addEventListener('drop', handleDrop);
                seat.addEventListener('dragend', handleDragEnd);
                seat.addEventListener('click', () => handleSeatClick(index));

                grid.appendChild(seat);
            });
        }

        function handleDragStart(e) {
            draggedIndex = parseInt(this.dataset.index);
            e.dataTransfer.setData('text/plain', draggedIndex);
            setTimeout(() => this.style.opacity = '0.4', 0);
        }

        function handleDragOver(e) {
            e.preventDefault();
            this.classList.add('drag-over');
        }

        function handleDragLeave() {
            this.classList.remove('drag-over');
        }

        async function handleDrop(e) {
            e.preventDefault();
            this.classList.remove('drag-over');
            const targetIndex = parseInt(this.dataset.index);

            if (draggedIndex !== null && draggedIndex !== targetIndex) {
                const temp = students[draggedIndex];
                students[draggedIndex] = students[targetIndex];
                students[targetIndex] = temp;

                await saveData();
                renderGrid();
            }
        }

        function handleDragEnd() {
            this.style.opacity = '1';
            document.querySelectorAll('.seat').forEach(s => s.classList.remove('drag-over'));
        }

        async function handleSeatClick(index) {
            if (selectedIndex === null) {
                selectedIndex = index;
                renderGrid();
            } else {
                const temp = students[selectedIndex];
                students[selectedIndex] = students[index];
                students[index] = temp;

                await saveData();
                selectedIndex = null;
                renderGrid();
            }
        }

        // Adatok betöltése induláskor, majd 5 másodpercenkénti frissítés a szinkronhoz
        loadData();
        setInterval(loadData, 5000);
    </script>
</body>
</html>
